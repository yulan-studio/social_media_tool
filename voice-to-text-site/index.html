<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f1e8" />
  <title>声迹 · 语音转文字</title>
  <meta name="description" content="一款简洁、私密的浏览器实时语音转文字工具。" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="#" aria-label="声迹首页">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>声迹</span>
    </a>
    <span class="privacy-pill"><span></span> 不保存录音 · 隐私优先</span>
  </header>

  <main>
    <section class="intro">
      <p class="eyebrow">VOICE TO TEXT</p>
      <h1>让每一句话，<em>落在纸上。</em></h1>
      <p class="subtitle">按下录音，清晰地说话。文字会实时出现在这里。</p>
    </section>

    <section class="workspace" aria-label="语音转文字工作区">
      <div class="toolbar">
        <div class="select-wrap">
          <label for="language">识别语言</label>
          <select id="language">
            <option value="zh-CN">普通话（简体中文）</option>
            <option value="zh-TW">中文（繁体）</option>
            <option value="yue-Hant-HK">粤语</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="ja-JP">日本語</option>
            <option value="ko-KR">한국어</option>
            <option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option>
            <option value="es-ES">Español</option>
          </select>
        </div>
        <div class="toolbar-actions">
          <button class="icon-button" id="undoButton" type="button" title="撤销" aria-label="撤销上一段" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M5 12h9a5 5 0 0 1 5 5"/></svg>
          </button>
          <button class="icon-button" id="clearButton" type="button" title="清空" aria-label="清空文字">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/></svg>
          </button>
        </div>
      </div>

      <div class="compat-warning" id="compatWarning" hidden>
        <strong>当前浏览器无法使用麦克风识别</strong>
        <span>请复制网址，改用最新版 Chrome 或 Edge 打开。</span>
        <button id="copyLinkButton" type="button">复制网址</button>
      </div>

      <div class="editor-wrap">
        <textarea id="transcript" spellcheck="true" aria-label="转写文字" placeholder="你的文字会出现在这里…"></textarea>
        <div id="interim" class="interim" aria-live="polite"></div>
        <div class="empty-hint" id="emptyHint" aria-hidden="true">
          <div class="sound-lines"><i></i><i></i><i></i><i></i><i></i></div>
          <p>准备好后，点击下方按钮开始</p>
        </div>
      </div>

      <div class="statusbar">
        <span id="status"><i></i> 等待开始</span>
        <span><b id="charCount">0</b> 字 · <b id="duration">00:00</b></span>
      </div>
    </section>

    <section class="controls">
      <button id="recordButton" class="record-button" type="button">
        <span class="record-icon"><i></i></span>
        <span id="recordLabel">开始录音</span>
      </button>
      <div class="export-actions">
        <button id="copyButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          复制文字
        </button>
        <button id="downloadButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 20h14"/></svg>
          下载 TXT
        </button>
      </div>
    </section>

    <p class="support-note" id="supportNote">首次使用时，请允许浏览器访问麦克风。若录音后没有文字，请改用最新版 Chrome 或 Edge 打开。</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
